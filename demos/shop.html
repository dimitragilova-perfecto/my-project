<!doctype html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Демо — онлайн магазин</title>
  <style>
    body { margin: 0; background: #f3f7f2; color: #23342b; font: 16px/1.5 Arial, sans-serif; }
    header, main { padding: 20px; }
    header { background: white; font-weight: bold; }
    main { max-width: 900px; margin: auto; }
    .products { display: flex; flex-wrap: wrap; gap: 16px; }
    article { flex: 1 1 200px; padding: 20px; background: white; border-radius: 10px; }
    button { padding: 10px 16px; border: 0; border-radius: 6px; background: #315d49; color: white; cursor: pointer; }
    button:focus-visible { outline: 3px solid #d5ab45; outline-offset: 3px; }
    .note { color: #536b5c; font-size: 13px; }
  </style>
</head>
<body>
  <header>◒ Luma Home · Демо магазин</header>
  <main>
    <h1>Малки радости за дома</h1>
    <p>Разгледайте примерните продукти и изпробвайте количката.</p>
    <div class="products">
      <article><h2>Керамична чаша</h2><p>24 лв.</p><button type="button" data-name="Керамична чаша" data-price="24">Добави</button></article>
      <article><h2>Ароматна свещ</h2><p>32 лв.</p><button type="button" data-name="Ароматна свещ" data-price="32">Добави</button></article>
      <article><h2>Ленена салфетка</h2><p>18 лв.</p><button type="button" data-name="Ленена салфетка" data-price="18">Добави</button></article>
    </div>
    <h2>Количка</h2>
    <ul id="cart"></ul>
    <p id="total" aria-live="polite">Общо: 0 лв.</p>
    <button id="clear" type="button">Изчисти количката</button>
    <p class="note">Демонстрация: няма реални продукти, поръчки или плащания.</p>
  </main>
  <script>
    const cart = [];
    const list = document.querySelector('#cart');
    const total = document.querySelector('#total');

    function render() {
      list.replaceChildren();
      cart.forEach((product) => {
        const item = document.createElement('li');
        item.textContent = `${product.name} — ${product.price} лв.`;
        list.append(item);
      });
      total.textContent = `Общо: ${cart.reduce((sum, product) => sum + product.price, 0)} лв.`;
    }

    document.querySelectorAll('[data-price]').forEach((button) => {
      button.addEventListener('click', () => {
        cart.push({ name: button.dataset.name, price: Number(button.dataset.price) });
        render();
      });
    });

    document.querySelector('#clear').addEventListener('click', () => {
      cart.length = 0;
      render();
    });
  </script>
</body>
</html>
